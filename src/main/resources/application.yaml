spring:
  application:
    name: ware-sync-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${POSTGRES_JDBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public

  task:
    scheduling:
      enabled: true

# Настройки внешнего API
external:
  api:
    wares-url: ${EXTERNAL_API_URL_WARES}
    barcodes-url: ${EXTERNAL_API_URL_BARCODES}
    invoices-url: ${EXTERNAL_API_URL_INVOICES}
    username: ${EXTERNAL_API_USERNAME}
    password: ${EXTERNAL_API_PASSWORD}

# Настройки логирования
logging:
  level:
    root: INFO
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Настройки сервера
server:
  port: ${SERVER_PORT}
  error:
    include-message: always
    include-binding-errors: always